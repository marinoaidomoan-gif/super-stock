<!--
  public/logo.svg : logo SuperStock, SOURCE de toutes les icônes de la PWA.
  Carré plein de 512 x 512 : Android et iOS arrondissent / découpent la forme
  eux-mêmes, il ne faut donc PAS de coins arrondis ni de transparence ici.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dégradé émeraude : du plus clair (haut gauche) au plus foncé (bas droite) -->
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399" />
      <stop offset="1" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Fond : tout le carré -->
  <rect width="512" height="512" fill="url(#fond)" />

  <!-- Caddie (icône de 24 x 24 agrandie 12 fois = 288 px, centrée dans le carré).
       Il occupe environ la moitié du carré, donc il reste dans la zone de
       sécurité des icônes "maskable" (le cercle central de 80 %). -->
  <g
    transform="translate(112 112) scale(12)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <circle cx="8" cy="21" r="1" />
    <circle cx="19" cy="21" r="1" />
    <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
  </g>
</svg>