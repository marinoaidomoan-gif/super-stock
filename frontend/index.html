<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperStock — Gestion de stock</title>
    <meta
      name="description"
      content="SuperStock, la solution moderne pour suivre vos produits, mouvements et inventaires en temps réel."
    />

    <!-- Couleur de la barre d'état du navigateur sur téléphone. -->
    <meta name="theme-color" content="#10b981" />

    <!-- Icônes : onglet du navigateur (SVG moderne + .ico pour les anciens)... -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <!-- ...et icône d'écran d'accueil sur iPhone / iPad. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-title" content="SuperStock" />

    <!-- Script du thème : type="module" évite les conflits avec React -->
    <script type="module">
      try {
        if (localStorage.getItem('superstock-theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
